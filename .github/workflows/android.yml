name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'main.lua'
      - 'conf.lua'
      - 'core/**'
      - 'screens/**'
      - 'assets/**'
      - 'songs/**'
      - 'android/**'
      - 'tools/package.py'
      - 'tools/android_package.py'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout SlideBeat
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache native build tools
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}/ndk/25.2.9519653
          key: slidebeat-ndk-25.2.9519653

      - name: Install Android build tools
        run: sdkmanager "ndk;25.2.9519653" "platforms;android-34" "build-tools;34.0.0"

      - name: Checkout LOVE Android 11.5a
        uses: actions/checkout@v4
        with:
          repository: love2d/love-android
          ref: 55feb38fa144f4734c26742389f279fb07d955c0
          path: love-android
          submodules: recursive

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: slidebeat-gradle-${{ runner.os }}-${{ hashFiles('android/**', 'love-android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: slidebeat-gradle-${{ runner.os }}-

      - name: Package and embed SlideBeat
        run: |
          set -euo pipefail
          python3 tools/package.py
          python3 tools/android_package.py prepare love-android \
            --version "2.0.${GITHUB_RUN_NUMBER}" \
            --code "$((2000000 + GITHUB_RUN_NUMBER))"

      - name: Compile release APKs
        working-directory: love-android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleEmbedNoRecordRelease --no-daemon

      - name: Align and sign APKs
        run: |
          set -euo pipefail
          BUILD_TOOLS="${ANDROID_HOME}/build-tools/34.0.0"
          mkdir -p signed
          for apk in love-android/app/build/outputs/apk/embedNoRecord/release/*.apk; do
            name=$(basename "$apk")
            "$BUILD_TOOLS/zipalign" -p -f 4 "$apk" "signed/aligned-$name"
            "$BUILD_TOOLS/apksigner" sign \
              --ks android/build-signing.jks --ks-type JKS \
              --ks-key-alias slidebeat --ks-pass pass:android --key-pass pass:android \
              --out "signed/$name" "signed/aligned-$name"
            rm "signed/aligned-$name"
            "$BUILD_TOOLS/apksigner" verify --verbose "signed/$name"
          done
          python3 tools/android_package.py validate signed
          sha256sum signed/*.apk > signed/SHA256SUMS.txt

      - name: Upload installable APKs
        uses: actions/upload-artifact@v4
        with:
          name: SlideBeat-Android-${{ github.run_number }}
          path: |
            signed/SlideBeat-android*.apk
            signed/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
